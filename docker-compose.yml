#version: "3.9"

services:
  devopsdb:
    image: naveen6399/3tier:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  application:
    image: naveen6399/3tier:app
    ports:
      - "80:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
